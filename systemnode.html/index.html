          const end = boundaryPoint(to, control);
          controls = {
            c1: {
              x: start.x + (control.x - start.x) * 2 / 3,
              y: start.y + (control.y - start.y) * 2 / 3
            },
            c2: {
              x: end.x + (control.x - end.x) * 2 / 3,
              y: end.y + (control.y - end.y) * 2 / 3
            }
          };
        } else {
          controls = defaultBezierControls(from, to);
        }
      }
      return {
        start: boundaryPoint(from, controls.c1),
        c1: controls.c1,
        c2: controls.c2,
        end: boundaryPoint(to, controls.c2)
      };
    }

    function ensureManualBezier(edge) {
      const from = edge && findNode(edge.from);
      const to = edge && findNode(edge.to);
      if (!edge || !from || !to) return null;
      const geometry = edgeBezierGeometry(edge, from, to);
      edge.curve = {
        type: "bezier",
        c1: { ...geometry.c1 },
        c2: { ...geometry.c2 }
      };
      return edge.curve;
    }

    function cubicPoint(a, b, c, d, t) {
      const mt = 1 - t;
      const mt2 = mt * mt;
      const t2 = t * t;
      return {
        x: mt2 * mt * a.x + 3 * mt2 * t * b.x + 3 * mt * t2 * c.x + t2 * t * d.x,
        y: mt2 * mt * a.y + 3 * mt2 * t * b.y + 3 * mt * t2 * c.y + t2 * t * d.y
      };
    }

    function quadraticPoint(a, b, c, t) {
      const mt = 1 - t;
      return {
        x: mt * mt * a.x + 2 * mt * t * b.x + t * t * c.x,
        y: mt * mt * a.y + 2 * mt * t * b.y + t * t * c.y
      };
    }

    function bezierRouteSamples(points, from, to) {
      if (points.length >= 4) {
        const samples = [];
        for (let i = 0; i <= 32; i++) samples.push(cubicPoint(points[0], points[1], points[2], points[3], i / 32));
        return samples;
      }
      return points.length ? points : [from, to];
    }

    function cubicSamples(start, c1, c2, end) {
      const samples = [];
      for (let i = 0; i <= 32; i++) samples.push(cubicPoint(start, c1, c2, end, i / 32));
      return samples;
    }

    function quadraticSamples(from, control, to) {
      const samples = [];
      for (let i = 0; i <= 24; i++) samples.push(quadraticPoint(from, control, to, i / 24));
      return samples;
    }

    function routeScore(from, to, route, lane, offset = 0) {
      let score = 0;
      const directLength = Math.hypot(from.x - to.x, from.y - to.y);
      const laneUsage = state.edges.filter(edge => edge.curve?.type === "route" && edge.curve.lane === lane).length;
      score += laneUsage * 120 + offset * 1.8;
      const samples = bezierRouteSamples(route, from, to);
      let sampledLength = 0;
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        const segmentLength = Math.hypot(a.x - b.x, a.y - b.y);
        sampledLength += segmentLength;
        score += segmentLength * 0.42;
        if (segmentSegmentDistance(a, b, from, to) < 18 && Math.hypot(a.x - b.x, a.y - b.y) > directLength * 0.45) score += 260;
        state.nodes.forEach(node => {
          if (node.id === from.id || node.id === to.id) return;
          const distance = distanceToSegment(node.x, node.y, a.x, a.y, b.x, b.y);
          if (distance < node.r + 30) score += 9000;
          else if (distance < node.r + 90) score += 1100;
        });
        state.edges.forEach(edge => {
          if (edge.from === from.id && edge.to === to.id) return;
          if (edge.from === to.id && edge.to === from.id) return;
          const otherFrom = findNode(edge.from);
          const otherTo = findNode(edge.to);
          if (!otherFrom || !otherTo) return;
          if (otherFrom.id === from.id || otherFrom.id === to.id || otherTo.id === from.id || otherTo.id === to.id) return;
          if (segmentsIntersect(a.x, a.y, b.x, b.y, otherFrom.x, otherFrom.y, otherTo.x, otherTo.y)) score += 1600;
        });
      }
      if (sampledLength > directLength * 2.15) score += (sampledLength - directLength * 2.15) * 1.6;
      return score;
    }

    function crossingCount() {
      let count = 0;
      forEachCrossing(() => count++);
      return count;
    }

    function forEachCrossing(callback) {
      for (let i = 0; i < state.edges.length; i++) {
        for (let j = i + 1; j < state.edges.length; j++) {
          const a = state.edges[i];
          const b = state.edges[j];
          if (a.from === b.from || a.from === b.to || a.to === b.from || a.to === b.to) continue;
          const a1 = findNode(a.from);
          const a2 = findNode(a.to);
          const b1 = findNode(b.from);
          const b2 = findNode(b.to);
          if (!a1 || !a2 || !b1 || !b2) continue;
          if (segmentsIntersect(a1.x, a1.y, a2.x, a2.y, b1.x, b1.y, b2.x, b2.y)) callback(a, b);
        }
      }
    }

    function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
      function orient(px, py, qx, qy, rx, ry) {
        return (qy - py) * (rx - qx) - (qx - px) * (ry - qy);
      }
      const o1 = orient(ax, ay, bx, by, cx, cy);
      const o2 = orient(ax, ay, bx, by, dx, dy);
      const o3 = orient(cx, cy, dx, dy, ax, ay);
      const o4 = orient(cx, cy, dx, dy, bx, by);
      return o1 * o2 < 0 && o3 * o4 < 0;
    }

    function editNodeName(node) {
      const input = document.createElement("input");
      const screen = worldToScreen(node);
      input.className = "name-editor";
      input.value = node.name;
      input.style.left = `${screen.x - 75}px`;
      input.style.top = `${screen.y - 17}px`;
      document.body.appendChild(input);
      input.select();

      function finish(shouldSave) {
        if (!document.body.contains(input)) return;
        if (shouldSave) {
          const name = input.value.trim();
          if (name && name !== node.name) {
            pushUndo();
            node.name = name;
          }
          save();
          draw();
        }
        input.remove();
      }

      input.addEventListener("keydown", event => {
        event.stopPropagation();
        if (event.key === "Enter") finish(true);
        if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
    }

    function editGroupName(group) {
      const input = document.createElement("input");
      const screen = worldToScreen({ x: group.rect.minX, y: group.rect.minY });
      input.className = "name-editor";
      input.value = group.name || "";
      input.style.left = `${screen.x}px`;
      input.style.top = `${screen.y}px`;
      input.style.width = `${Math.max(120, Math.min(220, (group.rect.maxX - group.rect.minX) * state.view.zoom))}px`;
      document.body.appendChild(input);
      input.select();

      function finish(shouldSave) {
        if (!document.body.contains(input)) return;
        if (shouldSave) {
          const name = input.value.trim();
          if (name && name !== group.name) {
            pushUndo();
            group.name = name;
          }
          save();
          draw();
        }
        input.remove();
      }

      input.addEventListener("keydown", event => {
        event.stopPropagation();
        if (event.key === "Enter") finish(true);
        if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
    }

    function draw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      drawGrid();
      ctx.save();
      ctx.translate(state.view.x, state.view.y);
      ctx.scale(state.view.zoom, state.view.zoom);
      drawGroups();
      drawEdges();
      drawLinkPreview();
      drawNodes();
      drawEdgeControls();
      drawNodeActions();
      drawSelectionBox();
      ctx.restore();
      relationViewBtn.classList.toggle("active", state.relationView);
      centerViewBtn.classList.toggle("active", state.centerView);
      snapToggleBtn.classList.toggle("active", state.snapToGrid);
      directionToggleBtn.classList.toggle("active", state.showDirection);
      colorbar.hidden = !state.relationView && !state.centerView;
      colorbar.querySelectorAll("button").forEach(button => {
        button.classList.toggle("active", button.dataset.scheme === state.colorScheme);
      });
      undoBtn.disabled = state.undoStack.length === 0;
      zoomStatus.textContent = `${Math.round(state.view.zoom * 100)}%`;
      syncHighlightAnimation();
    }

    function drawGroups() {
      if (!state.groups.length) return;
      ctx.save();
      state.groups.forEach(group => {
        const rect = group.rect;
        const width = rect.maxX - rect.minX;
        const height = rect.maxY - rect.minY;
        if (width <= 0 || height <= 0) return;
        const color = groupColor(group);
        const selected = group.id === state.selectedGroupId;
        ctx.lineWidth = (selected ? 7 : 5) / state.view.zoom;
        ctx.strokeStyle = color;
        ctx.fillStyle = transparentize(color, 0.055);
        ctx.setLineDash([18 / state.view.zoom, 12 / state.view.zoom]);
        if (selected) {
          ctx.shadowColor = transparentize(color, 0.35);
          ctx.shadowBlur = 12 / state.view.zoom;
        }
        ctx.fillRect(rect.minX, rect.minY, width, height);
        ctx.strokeRect(rect.minX, rect.minY, width, height);
        ctx.shadowColor = "transparent";
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        ctx.font = "700 17px PingFang SC, Microsoft YaHei, Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(group.name || "分组", rect.minX + 10, rect.minY + GROUP_LABEL_HEIGHT / 2, Math.max(20, Math.min(width, 220) - 18));
        ctx.setLineDash([18 / state.view.zoom, 12 / state.view.zoom]);
      });
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawGrid() {
      const grid = GRID_SIZE * state.view.zoom;
      if (grid < 8) return;
      const startX = ((state.view.x % grid) + grid) % grid;
      const startY = ((state.view.y % grid) + grid) % grid;
      ctx.save();
      ctx.strokeStyle = "rgba(31, 35, 40, 0.055)";
      ctx.lineWidth = 1;
      for (let x = startX; x < window.innerWidth; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, window.innerHeight);
        ctx.stroke();
      }
      for (let y = startY; y < window.innerHeight; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(window.innerWidth, y);
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(31, 35, 40, 0.12)";
      ctx.strokeRect(state.view.x, state.view.y, WORLD_WIDTH * state.view.zoom, WORLD_HEIGHT * state.view.zoom);
      ctx.restore();
    }

    function drawEdges() {
      ctx.save();
      ctx.lineCap = "round";
      state.edges.forEach(edge => {
        const from = findNode(edge.from);
        const to = findNode(edge.to);
        if (!from || !to) return;
        const selected = edge.id === state.selectedEdgeId;
        const selectedNodes = selectedNodeSet();
        const grouped = selectedNodes.has(edge.from) && selectedNodes.has(edge.to);
        const active = selected || grouped || edge.from === state.selectedNodeId || edge.to === state.selectedNodeId;
        const disabled = from.disabled || to.disabled;
        ctx.strokeStyle = disabled ? DISABLED_EDGE_COLOR : active ? rainbowEdge(from, to) : edgeColor(edge, active);
        ctx.lineWidth = edgeWidth(edge, active);
        ctx.setLineDash(disabled ? [9 / state.view.zoom, 7 / state.view.zoom] : []);
        const geometry = edgeBezierGeometry(edge, from, to);
        if (state.showDirection && !disabled) {
          const samples = cubicLengthSamples(geometry);
          const totalLength = samples[samples.length - 1]?.length || 0;
          const arrowInset = 15 / state.view.zoom;
          drawEdgePathBetweenDistances(geometry, samples, edge.bidirectional ? arrowInset : 0, Math.max(0, totalLength - arrowInset));
          drawEdgeDirection(geometry, edge, active, samples);
          if (edge.bidirectional) drawEdgeDirection(reverseEdgeGeometry(geometry), edge, active);
        } else {
          ctx.beginPath();
          ctx.moveTo(geometry.start.x, geometry.start.y);
          ctx.bezierCurveTo(geometry.c1.x, geometry.c1.y, geometry.c2.x, geometry.c2.y, geometry.end.x, geometry.end.y);
          ctx.stroke();
        }
      });
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawEdgePathBetweenDistances(geometry, samples, startDistance, endDistance) {
      if (!samples.length || endDistance <= startDistance) return;
      const totalLength = samples[samples.length - 1].length;
      if (startDistance <= 0 && endDistance >= totalLength) {
        ctx.beginPath();
        ctx.moveTo(geometry.start.x, geometry.start.y);
        ctx.bezierCurveTo(geometry.c1.x, geometry.c1.y, geometry.c2.x, geometry.c2.y, geometry.end.x, geometry.end.y);
        ctx.stroke();
        return;
      }
      const start = pointAtCurveDistance(samples, startDistance);
      const end = pointAtCurveDistance(samples, endDistance);
      if (!start || !end) return;
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      for (let index = 1; index < samples.length && samples[index].length < endDistance; index++) {
        if (samples[index].length <= startDistance) continue;
        ctx.lineTo(samples[index].point.x, samples[index].point.y);
      }
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
    }

    function reverseEdgeGeometry(geometry) {
      return {
        start: geometry.end,
        c1: geometry.c2,
        c2: geometry.c1,
        end: geometry.start
      };
    }

    function drawEdgeDirection(geometry, edge, active, samples = cubicLengthSamples(geometry)) {
      const color = edgeColor(edge, active);
      const totalLength = samples[samples.length - 1]?.length || 0;
      if (totalLength < 28) return;
      const spacing = 72 / state.view.zoom;
      const speed = 74 / state.view.zoom;
      const offset = performance.now() / 1000 * speed % spacing;
      const radius = Math.max(edgeWidth(edge, active) * 0.82, (active ? 4.2 : 3.4) / state.view.zoom);

      ctx.save();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      for (let distance = offset; distance < arrowDistance - spacing * 0.35; distance += spacing) {
        const point = pointAtCurveDistance(samples, distance);
        if (!point) continue;
        ctx.globalAlpha = 0.82;
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      const arrowTip = pointAtCurveDistance(samples, arrowDistance);
      const arrowTail = pointAtCurveDistance(samples, Math.max(0, arrowDistance - 24 / state.view.zoom));
      if (arrowTip && arrowTail) drawDirectionArrow(arrowTip, Math.atan2(arrowTip.y - arrowTail.y, arrowTip.x - arrowTail.x), color);
      ctx.restore();

    function cubicLengthSamples(geometry) {
      const samples = [];
      let previous = geometry.start;
      let length = 0;
      samples.push({ point: previous, length });
      for (let index = 1; index <= 56; index++) {
        const point = cubicPoint(geometry.start, geometry.c1, geometry.c2, geometry.end, index / 56);
        length += Math.hypot(point.x - previous.x, point.y - previous.y);
        samples.push({ point, length });

      return samples;

    function pointAtCurveDistance(samples, distance) {
      if (!samples.length) return null;
      if (distance <= 0) return samples[0].point;
      const last = samples[samples.length - 1];
      if (distance >= last.length) return last.point;
      for (let index = 1; index < samples.length; index++) {
        const current = samples[index];
        const previous = samples[index - 1];
        if (current.length < distance) continue;
        const segmentLength = Math.max(1, current.length - previous.length);
        const ratio = (distance - previous.length) / segmentLength;
        return {
          x: previous.point.x + (current.point.x - previous.point.x) * ratio,
          y: previous.point.y + (current.point.y - previous.point.y) * ratio

      return last.point;

    function drawDirectionArrow(tip, angle, color) {

    function drawEdgeControls() {

      ctx.moveTo(geometry.start.x, geometry.start.y);
      ctx.lineTo(geometry.c1.x, geometry.c1.y);
      ctx.moveTo(geometry.end.x, geometry.end.y);

    function drawRoutedEdge(from, to, points) {

          ctx.lineTo(current.x, current.y);

        const radius = 46;
        const inAngle = Math.atan2(current.y - prev.y, current.x - prev.x);
        const outAngle = Math.atan2(next.y - current.y, next.x - current.x);

          x: current.x - Math.cos(inAngle) * radius,
          y: current.y - Math.sin(inAngle) * radius

      const dy = to.y - from.y;
      const length = Math.max(1, Math.hypot(dx, dy));

        x: mx + (-dy / length) * curve,
        y: my + (dx / length) * curve

    function drawTextInNode(node, bottomReserve = 0) {

    function drawTextInBox(text, x, y, width, height, bottomReserve = 0) {
      const characters = Array.from(String(text).trim());
      if (!characters.length) return;

      const innerWidth = Math.max(8, width - 16);
      const innerHeight = Math.max(8, height - 14 - bottomReserve);
      const verticalCenter = -bottomReserve / 2;

      for (let fontSize = 15; fontSize >= 6; fontSize--) {
        ctx.font = `700 ${fontSize}px PingFang SC, Microsoft YaHei, Arial`;
        const lineHeight = fontSize * 1.16;
        const maxLines = Math.max(1, Math.floor(innerHeight / lineHeight));

        for (let lineCount = 1; lineCount <= maxLines; lineCount++) {
          const lines = wrapTextToWidths(characters, Array(lineCount).fill(innerWidth));
          if (!lines) continue;
          lines.forEach((line, index) => {
            const offset = verticalCenter + (index - (lineCount - 1) / 2) * lineHeight;
            ctx.fillText(line, x, y + offset);

          return;

    function drawTextInCircle(text, x, y, radius, bottomReserve = 0) {
      const characters = Array.from(String(text).trim());
      if (!characters.length) return;

      const innerRadius = Math.max(8, radius - 7);
      const top = -innerRadius;
      const bottom = innerRadius - bottomReserve;
      const verticalCenter = (top + bottom) / 2;
      const availableHeight = bottom - top;

      for (let fontSize = 15; fontSize >= 6; fontSize--) {
        ctx.font = `700 ${fontSize}px PingFang SC, Microsoft YaHei, Arial`;
        const lineHeight = fontSize * 1.16;
        const maxLines = Math.max(1, Math.floor(availableHeight / lineHeight));

        for (let lineCount = 1; lineCount <= maxLines; lineCount++) {
          const offsets = Array.from({ length: lineCount }, (_, index) =>
            verticalCenter + (index - (lineCount - 1) / 2) * lineHeight
          );
          const widths = offsets.map(offset => {
            const chord = 2 * Math.sqrt(Math.max(0, innerRadius ** 2 - offset ** 2));
            return Math.max(1, chord - 4);
          });
          const lines = wrapTextToWidths(characters, widths);
          if (!lines) continue;

          lines.forEach((line, index) => ctx.fillText(line, x, y + offsets[index]));
          return;
        }

      ctx.font = "700 6px PingFang SC, Microsoft YaHei, Arial";
      const fallbackLineHeight = 7;
      const fallbackWidth = innerRadius * 1.35;
      const fallbackLines = [];
      let currentLine = "";
      characters.forEach(character => {
        const candidate = currentLine + character;
        if (currentLine && ctx.measureText(candidate).width > fallbackWidth) {
          fallbackLines.push(currentLine);
          currentLine = character;
        } else {
          currentLine = candidate;
        }
      });
      if (currentLine) fallbackLines.push(currentLine);
      fallbackLines.forEach((line, index) => {
        const offset = (index - (fallbackLines.length - 1) / 2) * fallbackLineHeight;
        ctx.fillText(line, x, y + offset);
      });
    }

    function wrapTextToWidths(characters, widths) {
      const lines = [];

      for (let lineIndex = 0; lineIndex < widths.length; lineIndex++) {
        const remainingLines = widths.length - lineIndex - 1;
        const maxEnd = characters.length - remainingLines;
        let end = start;

        while (end < maxEnd) {
          const candidate = characters.slice(start, end + 1).join("");
          if (ctx.measureText(candidate).width > widths[lineIndex]) break;
          end++;

        lines.push(characters.slice(start, end).join(""));

        canvas.style.cursor = "grabbing";
        draw();
        return;
      }
      const interaction = nodeInteractionAt(point.x, point.y);
      const edgeNode = interaction?.zone === "edge" ? interaction.node : null;
      const node = interaction?.node || null;
      if (edgeNode) {
        selectNode(edgeNode.id);
        state.linking = { fromId: edgeNode.id, x: point.x, y: point.y };
      } else if (node) {
        if (!state.selectedNodeIds.includes(node.id)) selectNode(node.id);
        const selectedIds = state.selectedNodeIds.includes(node.id) ? [...state.selectedNodeIds] : [node.id];
        const selectedSet = new Set(selectedIds);
        state.dragging = {
          id: node.id,
          selectedIds,
          start: point,
          nodeStarts: state.nodes
            .filter(item => selectedSet.has(item.id))
            .map(item => ({ id: item.id, x: item.x, y: item.y })),
          edgeStarts: state.edges
            .filter(edge => selectedSet.has(edge.from) && selectedSet.has(edge.to))
            .map(edge => ({ id: edge.id, curve: JSON.parse(JSON.stringify(edge.curve || 0)) })),
          dx: node.x - point.x,
          dy: node.y - point.y,
          undoPushed: false
        };
      } else {
        const edge = edgeAt(point.x, point.y);
        if (edge) selectEdge(edge.id);
        else {
          const group = groupAt(point.x, point.y);
          if (group) {
            const selectedIds = group.nodeIds.filter(id => findNode(id));
            const selectedSet = new Set(selectedIds);
            selectGroup(group.id);
            state.dragging = {
              type: "group",
              id: group.id,
              selectedIds,
              start: point,
              groupStart: JSON.parse(JSON.stringify(group.rect)),
              nodeStarts: state.nodes
                .filter(item => selectedSet.has(item.id))
                .map(item => ({ id: item.id, x: item.x, y: item.y })),
              edgeStarts: state.edges
                .filter(edge => selectedSet.has(edge.from) && selectedSet.has(edge.to))
                .map(edge => ({ id: edge.id, curve: JSON.parse(JSON.stringify(edge.curve || 0)) })),
              undoPushed: false
            };
            canvas.style.cursor = "grabbing";
          } else {
            clearSelection();
            state.selectionBox = { start: point, current: point };
            canvas.style.cursor = "crosshair";
          }
        }
      }
      draw();
    });

    canvas.addEventListener("pointerleave", () => {
      state.hoverNodeId = null;
      state.hoverEdgeId = null;
      state.hoverNodeAction = null;
      state.nodeToolbarId = state.selectedNodeId;
      draw();
    });

    canvas.addEventListener("pointermove", event => {
      const screen = screenPoint(event);
      const point = screenToWorld(screen);
      if (state.panning) {
        state.view.x = state.panning.viewX + screen.x - state.panning.startX;
        state.view.y = state.panning.viewY + screen.y - state.panning.startY;
        clampView();
        draw();
        return;
      }
      if (state.selectionBox) {
        state.selectionBox.current = point;
        canvas.style.cursor = "crosshair";
        draw();
        return;
      }
      updateHover(point);
      if (state.edgeControlDrag) {
        const edge = findEdge(state.edgeControlDrag.edgeId);
        if (edge) {
          if (!state.edgeControlDrag.undoPushed) {
            pushUndo();
            state.edgeControlDrag.undoPushed = true;
          }
          const curve = ensureManualBezier(edge);
          if (curve) curve[state.edgeControlDrag.handle] = snapWorldPoint(point);
        }
        draw();
        return;
      }
      if (state.dragging) {
        if (!state.dragging.undoPushed) {
          pushUndo();
          state.dragging.undoPushed = true;
        }
        const moveX = point.x - state.dragging.start.x;
        const moveY = point.y - state.dragging.start.y;
        const selectedSet = new Set(state.dragging.selectedIds || [state.dragging.id]);
        if (state.dragging.type === "group") {
          const group = state.groups.find(item => item.id === state.dragging.id);
          if (group && state.dragging.groupStart) {
            group.rect.minX = state.dragging.groupStart.minX + moveX;
            group.rect.minY = state.dragging.groupStart.minY + moveY;
            group.rect.maxX = state.dragging.groupStart.maxX + moveX;
            group.rect.maxY = state.dragging.groupStart.maxY + moveY;
          }
        }
        state.dragging.nodeStarts.forEach(start => {
          const node = findNode(start.id);
          if (!node) return;
          node.x = snapWorldX(start.x + moveX);
          node.y = snapWorldY(start.y + moveY);
        });
        state.dragging.edgeStarts.forEach(start => {
          const edge = findEdge(start.id);
          if (!edge || !selectedSet.has(edge.from) || !selectedSet.has(edge.to)) return;
          edge.curve = JSON.parse(JSON.stringify(start.curve));
          translateCurve(edge.curve, moveX, moveY);
          snapCurve(edge.curve);
        });
        if (!state.selectedNodeIds.length && state.dragging.id) {
          const node = findNode(state.dragging.id);
          if (node) {
            node.x = snapWorldX(point.x + state.dragging.dx);
            node.y = snapWorldY(point.y + state.dragging.dy);
          }
        }
        updateAllGroupRects();
      }
      if (state.linking) {
        state.linking.x = point.x;
        state.linking.y = point.y;
      }
      draw();
    });

    window.addEventListener("pointerup", event => {
      const point = worldPoint(event);
      if (state.panning) {
        state.panning = null;
        save();
        draw();
        return;
      }
      if (state.selectionBox) {
        const rect = normalizedSelectionRect(state.selectionBox.start, state.selectionBox.current);
        const width = rect.maxX - rect.minX;
        const height = rect.maxY - rect.minY;
        const ids = width < 5 / state.view.zoom && height < 5 / state.view.zoom
          ? []
          : state.nodes.filter(node => nodeInRect(node, rect)).map(node => node.id);
        state.selectionBox = null;
        if (ids.length) selectNodes(ids);
        else clearSelection();
        save();
        draw();
        return;
      }
      if (state.linking) {
        const target = nodeAt(point.x, point.y);
        if (target) connectNodes(state.linking.fromId, target.id);
        state.linking = null;
        save();
        draw();
      }
      if (state.edgeControlDrag) {
        state.edgeControlDrag = null;
        save();
        draw();
      }
      if (state.dragging) {
        if (state.dragging.type !== "group") addNodesToGroupsIfDroppedInside(state.dragging.selectedIds || [state.dragging.id]);
        else updateAllGroupRects();
        state.dragging = null;
        save();
        draw();
      }
    });

    canvas.addEventListener("contextmenu", event => {
      event.preventDefault();
      showMenu(event.clientX, event.clientY, worldPoint(event));
    });

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      hideMenu();
      const screen = screenPoint(event);
      const before = screenToWorld(screen);
      const factor = Math.exp(-event.deltaY * 0.001);
      state.view.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, state.view.zoom * factor));
      state.view.x = screen.x - before.x * state.view.zoom;
      state.view.y = screen.y - before.y * state.view.zoom;
      clampView();
      draw();
    }, { passive: false });

    menu.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === "rename") {
        const node = findNode(state.selectedNodeId);
        const group = findGroup(state.selectedGroupId);
        if (node) editNodeName(node);
        else if (group) editGroupName(group);
      }
      if (action === "copy") copySelection();
      if (action === "cut") cutSelection();
      if (action === "paste") pasteNode();
      if (action === "group") createGroupFromSelection();
      if (action === "set-center") setCenterNode(state.selectedNodeId);
      if (action === "reverse-edge") reverseSelectedEdge();
      if (action === "delete") deleteSelection();
      if (action === "open") openFromFile();
      if (action === "save") saveToFile();
      if (action === "save-as") saveAsFile();
      if (action === "export") exportJson();
      if (action === "clear") clearAll();
      hideMenu();
    });

    window.addEventListener("keydown", event => {
      if (event.target instanceof HTMLInputElement) return;
      const command = event.metaKey || event.ctrlKey;
      if (command && event.key.toLowerCase() === "c") {
        event.preventDefault();
        copySelection();
      }
      if (command && event.key.toLowerCase() === "x") {
        event.preventDefault();
        cutSelection();
      }
      if (command && event.key.toLowerCase() === "z" && !event.shiftKey) {
        event.preventDefault();
        undo();
      }
      if (command && event.key.toLowerCase() === "v") {
        event.preventDefault();
        const center = screenToWorld({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        const anchor = selectionCenter() || (state.selectedNodeId ? findNode(state.selectedNodeId) : null);
        pasteNode((anchor ? anchor.x + 36 : center.x) || center.x,
          (anchor ? anchor.y + 36 : center.y) || center.y);
      }
      if (command && event.key.toLowerCase() === "s") {
        event.preventDefault();
        if (event.shiftKey) saveAsFile();
        else saveToFile();
      }
      if (command && event.key.toLowerCase() === "o") {
        event.preventDefault();
        openFromFile();
      }
      if (!command && event.key.toLowerCase() === "f") {
        event.preventDefault();
        focusSelectionOrAll();
      }
      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        deleteSelection();
      }
      if (event.key === "Escape") {
        state.dragging = null;
        state.selectionBox = null;
        state.edgeControlDrag = null;
        state.linking = null;
        state.panning = null;
        state.hoverNodeAction = null;
        state.nodeToolbarId = null;
        hideMenu();
        clearSelection();
        draw();
      }
      if (event.code === "Space") {
        state.spaceDown = true;
        canvas.style.cursor = "grab";
      }
    });

    window.addEventListener("keyup", event => {
      if (event.code === "Space") {
        state.spaceDown = false;
        if (!state.panning) canvas.style.cursor = "default";
      }
    });

    window.addEventListener("pointerdown", event => {
      if (!menu.hidden && !menu.contains(event.target)) hideMenu();
    });
    newBtn.addEventListener("click", newMap);
    openBtn.addEventListener("click", openFromFile);
    saveBtn.addEventListener("click", saveToFile);
    saveAsBtn.addEventListener("click", saveAsFile);
    snapToggleBtn.addEventListener("click", toggleSnapToGrid);
    directionToggleBtn.addEventListener("click", toggleDirection);
    colorbar.addEventListener("click", event => {
      const button = event.target.closest("button[data-scheme]");
      if (button) setColorScheme(button.dataset.scheme);
    });
    relationViewBtn.addEventListener("click", () => {
      state.relationView = !state.relationView;
      if (state.relationView) state.centerView = false;
      save();
      draw();
    });
    centerViewBtn.addEventListener("click", () => {
      ensureCenterNode(true);
      if (state.selectedNodeId) state.centerNodeId = state.selectedNodeId;
      state.centerView = !state.centerView;
      if (state.centerView) state.relationView = false;
      save();
      draw();
    });
    autoLayoutBtn.addEventListener("click", autoLayout);
    undoBtn.addEventListener("click", undo);
    window.addEventListener("resize", resize);

    load();
    ensureCenterNode(true);
    save(false);
    resize();
    focusSelectionOrAll();
    loadStoredFileHandle();
  </script>
</body>
</html>
